<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script Arrays </title>
</head>
<body>
    <h1>Java Script Arrays</h1>

    <p id="demo"></p>


    <script>
        console.log("JavaScript Arrays");

        const fruitsArray = ["Apple", "Banana", "Cherry"];

        // Accessing elements
        console.log(fruitsArray); // Output: Apple
        document.getElementById("demo").innerHTML = fruitsArray;
    </script>
</body>
</html>
